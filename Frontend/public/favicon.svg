<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Glowing background radial glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Linear gradient for the main AI Sparkle -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#2de2b4"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Glow Aura -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <!-- Centered AI Sparkles with glow filter -->
  <g filter="url(#glow-filter)">
    <!-- Main Sparkle shape -->
    <path d="M256 96 C256 180 180 256 96 256 C180 256 256 332 256 416 C256 332 332 256 416 256 C332 256 256 180 256 96 Z" fill="url(#sparkle-grad)"/>
    
    <!-- Top-Left mini-sparkle -->
    <path d="M128 100 C128 120 108 136 88 136 C108 136 128 152 128 172 C128 152 148 136 168 136 C148 136 128 120 128 100 Z" fill="#2de2b4"/>
    
    <!-- Bottom-Right mini-sparkle -->
    <path d="M384 340 C384 360 364 376 344 376 C364 376 384 392 384 412 C384 392 404 376 424 376 C404 376 384 360 384 340 Z" fill="#10a37f"/>
  </g>
</svg>